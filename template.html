    <!-- High-Performance Animated Stickers & Icons Fallback Engine -->
    <script>
      (function() {
        window.addEventListener("error", function(e) {
          const el = e.target;
          if (el && el.tagName === "IMG" && el.src && el.src.includes("Telegram-Animated-Emojis") && !el.dataset.fallbackDone) {
            el.dataset.fallbackDone = "1";
            const currentSrc = el.src;
            const rel = currentSrc.replace(/^https?://[^/]+(/gh/[^/]+/[^@]+@[^/]+/|/main/)?/, "")
                                  .replace(/^Telegram-Animated-Emojis/(main/)?/, "")
                                  .replace(/^/+/, "");
            el.src = "/api/emoji-proxy?path=" + encodeURIComponent(decodeURIComponent(rel));
          }
        }, true);
      })();
    </script>

    <script>
      // Force animated emojis by default - removed static emojis toggle
      localStorage.setItem("staticEmojis", "false");
      window.toggleSiteParticlesSetting = function (enabled) {
        localStorage.setItem("siteParticles", enabled ? "true" : "false");
        const canvas = document.getElementById("particle-canvas");
        if (canvas)
          canvas.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      window.updateParticleBrightness = function (value) {
        localStorage.setItem("siteParticleBrightness", value);
        const canvas = document.getElementById("particle-canvas");
        if (canvas) canvas.style.setProperty("opacity", value);
      };
      window.toggleSiteNeuroSetting = function (enabled) {
        localStorage.setItem("siteNeuro", enabled ? "true" : "false");
        const bg = document.getElementById("premium-black-bg");
        if (bg)
          bg.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      document.addEventListener("DOMContentLoaded", () => {
        const pVal = localStorage.getItem("siteParticles");
        if (pVal === "false") {
          const cb = document.getElementById("site-settings-particle");
          if (cb) cb.checked = false;
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("display", "none", "important");
        }
        const pBright = localStorage.getItem("siteParticleBrightness");
        if (pBright !== null) {
          const cbBright = document.getElementById(
            "site-settings-particle-brightness",
          );
          if (cbBright) cbBright.value = pBright;
          const cbBrightVal = document.getElementById(
            "particle-brightness-val",
          );
          if (cbBrightVal)
            cbBrightVal.innerText = Math.round(Number(pBright) * 100) + "%";
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("opacity", pBright);
        }
        const nVal = localStorage.getItem("siteNeuro");
        if (nVal === "false") {
          const cb = document.getElementById("site-settings-neuro");
          if (cb) cb.checked = false;
          const bg = document.getElementById("premium-black-bg");
          if (bg) bg.style.setProperty("display", "none", "important");
        }
      });
    </script>

    <script>
      (() => {
        try {
          localStorage.removeItem("cowio:globalTheme");
          document.documentElement.dataset.globalTheme = "dark";
          document.documentElement.classList.remove("theme-light-global");
        } catch (e) {}
      })();
    </script>
