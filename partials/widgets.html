<div id="reaction-layer"></div>

  <!-- Floating Picture-in-Picture (PiP) Mini Player -->
  <div id="room-pip-widget" class="room-pip-widget glass-panel" style="display: none;">
    <div class="pip-drag-handle">
      <div class="pip-room-info">
        <span class="pip-live-dot"></span>
        <div class="pip-text-wrap">
          <span id="pip-room-title" class="pip-title">Комната</span>
          <span id="pip-room-host" class="pip-host">Хост</span>
        </div>
      </div>
      <div class="pip-actions">
        <button type="button" class="pip-action-btn" title="Развернуть комнату" onclick="if(window.RoomManager) RoomManager.returnFromPiPToRoom()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
        <button type="button" class="pip-action-btn pip-close-btn" title="Выйти из комнаты" onclick="if(window.RoomManager) { RoomManager.leaveRoom(); RoomManager.disablePiP(); }">
          ✕
        </button>
      </div>
    </div>
    <div class="pip-controls-row">
      <button type="button" class="pip-return-btn primary-btn" onclick="if(window.RoomManager) RoomManager.returnFromPiPToRoom()">
        Вернуться в комнату
      </button>
    </div>
  </div>
