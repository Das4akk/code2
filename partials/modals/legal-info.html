<div class="modal" id="modal-legal-info">
      <div class="modal-content glass-panel" style="
          max-width: 500px;
          text-align: left;
          padding: 25px;
          position: relative;
        ">
        <button class="close-btn" onclick="
            document
              .getElementById('modal-legal-info')
              .classList.remove('active')
          " style="
            position: absolute;
            right: 15px;
            top: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.3s;
            z-index: 10;
          " onmouseover="this.style.background = 'rgba(255, 255, 255, 0.2)'" onmouseout="this.style.background = 'rgba(255, 255, 255, 0.1)'">
          ✕
        </button>
        <h2 id="legal-modal-title" style="
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
          "></h2>
        <div id="legal-modal-body" style="
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
          "></div>
      </div>
    </div>
