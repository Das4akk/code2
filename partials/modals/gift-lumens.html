<div class="modal modal-gift-luxury" id="modal-gift-lumens" style="z-index: 100005; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(5, 5, 8, 0.7);">
      
      <div class="modal-content gift-card-horizontal">
        <button class="btn-close-modal" id="btn-close-gift-lumens-modal" style="position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 5;" onmouseover="this.style.background='rgba(255,255,255,0.22)';" onmouseout="this.style.background='rgba(255,255,255,0.08)';">
          ✕
        </button>

        <div class="gift-horizontal-grid">
          <!-- Col 1: Recipient & Balances -->
          <div style="display: flex; flex-direction: column; gap: 12px; border-right: 1px solid rgba(255, 255, 255, 0.08); padding-right: 18px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" alt="✨" style="width: 22px; height: 22px; object-fit: contain;">
              <div>
                <h3 style="margin: 0; font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;">Подарок Люменов</h3>
                <span style="font-size: 11px; color: rgba(255, 255, 255, 0.5);">Перевод другу</span>
              </div>
            </div>

            <!-- Recipient pill -->
            <div id="gift-target-user-card" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;">
              <div id="gift-target-avatar-preview" style="width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #000; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.3); color: #fff;">
                ?
              </div>
              <div style="overflow: hidden; flex: 1;">
                <div id="gift-target-name-preview" style="font-size: 13.5px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Друг</div>
                <div id="gift-target-username-preview" style="font-size: 11.5px; color: rgba(255, 255, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">@username</div>
              </div>
            </div>

            <!-- Balances -->
            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 11.5px;">
              <div style="display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.6);">
                <span>Ваш баланс:</span>
                <span style="font-weight: 700; color: #ffffff; display: inline-flex; align-items: center; gap: 4px;">
                  <span id="gift-modal-my-lumens">0</span>
                  <img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" alt="✨" style="width: 13px; height: 13px; object-fit: contain;">
                </span>
              </div>
              <div style="display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.6);">
                <span>Лимит на сегодня:</span>
                <span style="font-weight: 700; color: #ffffff;">
                  <span id="gift-modal-remaining-limit">100</span><span style="color: rgba(255,255,255,0.4);">/100</span>
                </span>
              </div>
            </div>
          </div>

          <!-- Col 2: Amount Stepper, Presets & Note (Overflow-proof) -->
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 0.05em;">Сумма Люменов</span>
              <span id="gift-modal-error-msg" style="font-size: 11px; color: #ffffff; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; padding: 2px 7px; font-weight: 600; display: none;"></span>
            </div>

            <!-- Stepper Container with wide, responsive, no-overflow input -->
            <div style="display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 6px 10px;">
              <button type="button" class="gift-step-btn-bw" id="gift-lumens-btn-minus" aria-label="Уменьшить">−</button>
              <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0;">
                <input type="number" id="gift-lumens-amount-input" min="1" value="5" style="width: 100%; min-width: 110px; max-width: 180px; text-align: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; font-size: 26px; font-weight: 800; color: #ffffff; outline: none; -moz-appearance: textfield; font-family: inherit; letter-spacing: -0.02em; padding: 6px 10px; box-sizing: border-box; overflow: visible;">
                <img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" alt="✨" style="width: 22px; height: 22px; object-fit: contain; flex-shrink: 0;">
              </div>
              <button type="button" class="gift-step-btn-bw" id="gift-lumens-btn-plus" aria-label="Увеличить">+</button>
            </div>

            <!-- Quick Presets -->
            <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;">
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="5">+5</button>
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="10">+10</button>
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="25">+25</button>
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="50">+50</button>
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="100">+100</button>
              <button type="button" class="gift-preset-btn gift-preset-chip-bw" data-amount="max" style="font-weight: 800;">Всё</button>
            </div>

            <!-- Note Input -->
            <input type="text" id="gift-lumens-note-input" maxlength="60" placeholder="Пожелание другу (необязательно)..." style="width: 100%; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; font-size: 12.5px; outline: none; box-sizing: border-box; transition: all 0.2s;" onfocus="this.style.borderColor='rgba(255,255,255,0.3)';" onblur="this.style.borderColor='rgba(255,255,255,0.1)';">
          </div>

          <!-- Col 3: Balance remaining & Action Buttons -->
          <div style="display: flex; flex-direction: column; gap: 10px; justify-content: center; border-left: 1px solid rgba(255, 255, 255, 0.08); padding-left: 18px;">
            <div style="font-size: 11px; color: rgba(255, 255, 255, 0.5); text-align: center;">
              Остаток: <strong style="color: #ffffff;"><span id="gift-modal-after-balance">0</span> ✨</strong>
            </div>

            <button class="primary-btn" id="btn-submit-gift-lumens" style="width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 700; background: #ffffff; color: #000000; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);" onmouseover="this.style.background='rgba(255,255,255,0.9)';" onmouseout="this.style.background='#ffffff';">
              <span>Подарить</span>
              <span id="gift-modal-btn-amount">5</span>
              <img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" alt="✨" style="width: 15px; height: 15px; object-fit: contain;">
            </button>

            <button class="secondary-btn btn-close-modal" id="btn-cancel-gift-lumens" style="width: 100%; padding: 9px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.7); cursor: pointer; text-align: center; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.12)'; this.style.color='#fff';" onmouseout="this.style.background='rgba(255,255,255,0.05)'; this.style.color='rgba(255,255,255,0.7)';">
              Отмена
            </button>
          </div>
        </div>
      </div>
    </div>
