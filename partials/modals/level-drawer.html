<!-- LEVEL & XP RATING DRAWER -->
<div id="level-bottom-sheet-overlay" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.3s ease;
  "></div>
<div id="level-bottom-sheet" style="
    position: fixed;
    inset: auto 0 0 0;
    background: rgba(28, 28, 30, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px 20px 0 0;
    z-index: 10001;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding: 12px 20px 40px;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
  ">
  <!-- Handle -->
  <div style="
      width: 36px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      margin: 0 auto 24px;
    "></div>

  <div style="flex: 1; overflow-y: auto; overflow-x: hidden" class="no-scrollbar">
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 32px">
      <div id="drawer-star-container" style="
          display: inline-block;
          animation: throbStar 4s ease-in-out infinite;
          margin-bottom: 20px;
        ">
        <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Animals%20and%20Nature/Star.webp" style="width: 100px; height: 100px; object-fit: contain" alt="⭐">
      </div>
      <h3 style="
          font-size: 26px;
          font-weight: 700;
          color: #fff;
          margin-bottom: 12px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        ">
        Рейтинг профиля
      </h3>
      <div style="
          font-size: 15px;
          color: rgba(255, 255, 255, 0.5);
          font-weight: 400;
          line-height: 1.4;
          max-width: 280px;
          margin: 0 auto;
        ">
        Уровень профиля отражает вашу общую активность и надежность на платформе.
      </div>
    </div>

    <!-- Progress Bar Section -->
    <div style="
        background: rgba(44, 44, 46, 0.5);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 24px;
      ">
      <div style="
          display: flex;
          justify-content: space-between;
          margin-bottom: 12px;
          align-items: flex-end;
        ">
        <span id="drawer-level-title" style="font-size: 16px; color: #fff; font-weight: 600">Уровень 0</span>
        <span id="drawer-xp-text" style="
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
          ">0 / 100 <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Animals%20and%20Nature/Glowing%20Star.webp" style="width:16px;height:16px;vertical-align:middle;" alt="🌟"></span>
      </div>
      <div id="drawer-xp-bar-container" style="
          width: 100%;
          height: 6px;
          background: rgba(0, 0, 0, 0.3);
          border-radius: 6px;
          overflow: hidden;
          position: relative;
        ">
        <div id="drawer-xp-progress" style="
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f5d142, #ff9d00);
            border-radius: 6px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
          "></div>
      </div>
    </div>

    <button type="button" class="primary-btn btn-close-drawer" style="
        width: 100%;
        padding: 14px;
        font-size: 16px;
        border-radius: 12px;
        background: #007aff;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      ">
      ОК
    </button>
  </div>
</div>
