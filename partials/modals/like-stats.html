<div class="modal" id="modal-like-stats">
      <div class="modal-content glass-panel" style="max-width: 800px; padding: 24px; position: relative; text-align: left;">
        <button class="modal-close" onclick="document.getElementById('modal-like-stats').classList.remove('active')" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; line-height: 1;">&times;</button>
        <h2 style="margin-top:0; font-size:20px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
          Статистика лайков
          <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Symbols/Red%20Heart.webp" style="width: 24px; height: 24px;" alt="Heart">
        </h2>
        <div style="margin: 15px 0; font-size: 16px;">
          Всего лайков: <strong id="like-stats-total" style="color:var(--primary); font-size: 18px;">0</strong>
        </div>
        <div style="font-size: 14px; margin-bottom: 10px; color: var(--text-muted); font-weight: 500;">
          Последние 10 лайков:
          <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Eyes.webp" style="width: 18px; height: 18px; vertical-align: bottom; margin-left: 4px;">
        </div>
        <div id="like-stats-list" class="oled-scrollbar" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;">
          <!-- list -->
        </div>
      </div>
    </div>
