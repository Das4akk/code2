<div class="modal" id="modal-edit-profile">
      <div class="modal-content glass-panel">
        <div class="modal-drag-handle"></div>
        <!-- Mobile Swipe Handle -->
        <div class="profile-modal-top">
          <h2 style="margin-bottom: 0">
            <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Bust%20In%20Silhouette.webp" style="width: 1.2em; height: 1.2em; vertical-align: bottom">
            Настройки профиля
          </h2>
          <div class="profile-menu-wrap">
            <button class="profile-menu-btn" id="btn-profile-menu" aria-label="Меню профиля">
              ⋮
            </button>
            <div class="profile-menu-dropdown" id="profile-menu-dropdown">
              <button class="profile-menu-item" id="btn-open-security">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Shield.webp" style="width:1.2em;height:1.2em;vertical-align:middle;margin-right:6px;" alt="🛡️">Безопасность
              </button>
            </div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="
              display: flex;
              gap: 15px;
              align-items: center;
              margin-bottom: 10px;
            ">
            <div class="avatar-wrapper" style="
                position: relative;
                width: 70px;
                height: 70px;
                flex-shrink: 0;
              ">
              <div class="avatar" id="edit-avatar-preview" style="
                  width: 100%;
                  height: 100%;
                  font-size: 24px;
                  border-radius: 50%;
                  overflow: visible;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  background: #111;
                ">
                ?
              </div>
              <img id="edit-avatar-frame" src="" style="
                  width: 130%;
                  height: 130%;
                  object-fit: contain;
                  position: absolute;
                  top: -15%;
                  left: -15%;
                  z-index: 2;
                  pointer-events: none;
                  display: none;
                ">
            </div>
            <div style="flex: 1; min-width: 0">
              <input type="text" id="edit-avatar-url" placeholder="URL аватарки (ссылка)" style="margin: 0">
              <input type="file" id="edit-avatar-file" accept="image/*" style="margin-top: 8px; font-size: 12px">
            </div>
          </div>

          <div style="margin-bottom: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label style="display:block; margin: 0; font-weight: bold; font-size: 14px;">Шапка профиля (Баннер)</label>
              <button type="button" id="btn-remove-banner" style="display: none; background: rgba(255,85,85,0.15); border: 1px solid rgba(255,85,85,0.4); color: #ff7777; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s;" title="Полностью удалить баннер">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Wastebasket.webp" style="width:1.2em;height:1.2em;vertical-align:middle;margin-right:6px;" alt="🗑">Удалить баннер
              </button>
            </div>
            <input type="text" id="edit-banner-url" placeholder="URL баннера (ссылка, gif)" style="margin-bottom: 8px">
            <input type="file" id="edit-banner-file" accept="image/*" style="margin-bottom: 8px; font-size: 12px">
            
            <label style="display:flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;">
              <span>Затемнение баннера</span>
              <span id="banner-dimming-val">30%</span>
            </label>
            <input type="range" id="edit-banner-dimming" min="0" max="100" value="30" style="width: 100%;">

            <!-- Настройка видимой области баннера (кадрирование) -->
            <div id="banner-position-container" style="display: none; margin-top: 14px; padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 13px; font-weight: 600; color: #fff;">Настройка видимой области (кадрирование)</span>
                <span id="banner-pos-val" style="font-size: 12px; font-weight: 700; color: var(--accent);">50%</span>
              </div>
              <div id="banner-crop-preview-wrap" style="position: relative; width: 100%; height: 110px; border-radius: 8px; overflow: hidden; background: #111; cursor: ns-resize; border: 1px dashed rgba(255,255,255,0.25); margin-bottom: 10px; user-select: none;" title="Потяните вверх или вниз, чтобы настроить видимую часть">
                <img id="banner-crop-preview-img" style="width: 100%; height: 100%; object-fit: cover; object-position: center 50%; pointer-events: none; display: none;" alt="Предпросмотр баннера">
                <div id="banner-crop-dimming-overlay" style="position: absolute; inset: 0; background-color: rgba(0,0,0,0.3); pointer-events: none; transition: background-color 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: none;"></div>
                <div style="position: absolute; bottom: 6px; left: 8px; font-size: 11px; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; pointer-events: none; backdrop-filter: blur(4px);">
                  ↕ Потяните изображение или двигайте ползунок
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 11px; opacity: 0.6;">Верх</span>
                <input type="range" id="edit-banner-pos" min="0" max="100" value="50" style="flex: 1; accent-color: var(--accent); cursor: pointer;">
                <span style="font-size: 11px; opacity: 0.6;">Низ</span>
              </div>
            </div>
          </div>

          <div style="margin-bottom: 10px; margin-top: 5px">
            <div style="
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
                color: var(--text-main);
              ">
              Рамка профиля
            </div>
            <div id="profile-frames-carousel" style="
                display: flex;
                gap: 12px;
                overflow-x: auto;
                padding-bottom: 8px;
                scrollbar-width: thin;
                scrollbar-color: var(--border-light) transparent;
              ">
              <!-- JS injected -->
            </div>
          </div>
          <div style="margin-bottom: 12px; text-align: left">
            <label for="edit-name" style="
                display: block;
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 4px;
                font-weight: 500;
              ">Отображаемое имя</label>
            <input type="text" id="edit-name" placeholder="Напр. Алексей">
          </div>
          <div style="margin-bottom: 12px; text-align: left">
            <label for="edit-username-input" style="
                display: block;
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 4px;
                font-weight: 500;
              ">Уникальный ID</label>
            <input type="text" id="edit-username-input" placeholder="Напр. alexey99 (без @)">
          </div>
          <div id="extra-usernames-container" style="display: none; margin-bottom: 12px; text-align: left">
            <label style="
                display: block;
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 4px;
                font-weight: 500;
              ">Дополнительные ID</label>
            <input type="text" id="edit-extra-username-input-1" placeholder="+ ID (с 30 уровня)" style="margin-top: 5px; border-color: rgba(255, 200, 100, 0.4)">
            <input type="text" id="edit-extra-username-input-2" placeholder="+ ID (с 50 уровня)" style="margin-top: 5px; border-color: rgba(255, 200, 100, 0.4)">
            <input type="text" id="edit-extra-username-input-3" placeholder="+ ID (со 100 уровня)" style="margin-top: 5px; border-color: rgba(255, 200, 100, 0.4)">
          </div>
          <div style="position: relative; margin-bottom: 12px; text-align: left">
            <label for="edit-bio" style="
                display: block;
                font-size: 13px;
                color: var(--text-muted);
                margin-bottom: 4px;
                font-weight: 500;
              ">О себе</label>
            <textarea id="edit-bio" placeholder="Расскажите немного о себе..." rows="3"></textarea>
            <div id="edit-bio-counter" style="
                text-align: right;
                font-size: 11px;
                color: var(--text-muted);
                margin-top: 2px;
              ">
              0/200
            </div>
          </div>

          <div class="user-gender-select" style="
              display: flex;
              gap: 10px;
              margin-top: 5px;
              margin-bottom: 5px;
            ">
            <label style="flex: 1; cursor: pointer">
              <input type="radio" name="edit-gender" value="male" style="display: none">
              <div class="gender-btn" style="
                  padding: 10px;
                  border-radius: 8px;
                  border: 1px solid var(--border-light);
                  text-align: center;
                  background: rgba(0, 0, 0, 0.2);
                  font-size: 14px;
                  font-weight: 600;
                ">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Man%20Technologist.webp" style="
                    width: 20px;
                    height: 20px;
                    vertical-align: middle;
                    margin-right: 5px;
                  ">
                Мужчина
              </div>
            </label>
            <label style="flex: 1; cursor: pointer">
              <input type="radio" name="edit-gender" value="female" style="display: none">
              <div class="gender-btn" style="
                  padding: 10px;
                  border-radius: 8px;
                  border: 1px solid var(--border-light);
                  text-align: center;
                  background: rgba(0, 0, 0, 0.2);
                  font-size: 14px;
                  font-weight: 600;
                ">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Woman%20Technologist.webp" style="
                    width: 20px;
                    height: 20px;
                    vertical-align: middle;
                    margin-right: 5px;
                  ">
                Женщина
              </div>
            </label>
          </div>

          <!-- // [NEW] SECOND HALF SELF PROFILE UI -->
          <div class="partner-container" id="edit-partner-container" style="display: none !important"></div>
          <div class="love-requests-box" id="my-love-requests"></div>
          <div class="hashtag-input-wrap">
            <div class="hashtag-suggestions" id="profile-hashtag-suggestions"></div>
            <input type="text" id="edit-hashtags" placeholder="#music #movies #gaming">
          </div>
          <div class="modal-actions">
            <button class="secondary-btn btn-close-modal">Отмена</button>
            <button class="primary-btn" id="btn-save-profile">Сохранить</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Legal Info Modal -->
