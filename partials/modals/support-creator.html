<div id="modal-support-creator-panel" class="modal" style="z-index: 9000">
      <div class="modal-content" style="
          width: 100%;
          max-width: 800px;
          padding: 30px;
          border-radius: 24px;
          position: relative;
          display: flex;
          flex-direction: column;
          gap: 20px;
          background: rgba(14, 14, 18, 0.94);
          backdrop-filter: blur(32px) saturate(180%);
          -webkit-backdrop-filter: blur(32px) saturate(180%);
          border: 1px solid rgba(255, 255, 255, 0.16);
          box-shadow: 0 24px 70px rgba(0,0,0,0.85);
          animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        ">
        <button class="secondary-btn" style="
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 10px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
          " onclick="
            document
              .getElementById('modal-support-creator-panel')
              .classList.remove('active')
          ">
          ✕
        </button>
        <h2 style="
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.02em;
          ">
          <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Crown.webp" style="width: 24px; height: 24px; vertical-align: middle;">
          Панель Создателя (Поддержка)
        </h2>
        <div style="color: rgba(255, 255, 255, 0.5); font-size: 13px; margin-top: -10px">
          Статистика обращений, управление доступом и шаблонами ответов
        </div>

        <div style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
          ">
          <div style="
              background: rgba(255, 255, 255, 0.04);
              padding: 18px;
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.12);
              text-align: center;
            ">
            <div style="font-size: 28px; font-weight: 800; color: #ffffff" id="stat-total-tickets">
              0
            </div>
            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-top: 4px; font-weight: 500;">
              Всего тикетов
            </div>
          </div>
          <div style="
              background: rgba(255, 255, 255, 0.04);
              padding: 18px;
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.18);
              text-align: center;
            ">
            <div style="font-size: 28px; font-weight: 800; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 6px;" id="stat-open-tickets">
              0
            </div>
            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 4px; font-weight: 600;">
              В работе
            </div>
          </div>
          <div style="
              background: rgba(255, 255, 255, 0.04);
              padding: 18px;
              border-radius: 16px;
              border: 1px solid rgba(255, 255, 255, 0.08);
              text-align: center;
            ">
            <div style="font-size: 28px; font-weight: 800; color: rgba(255, 255, 255, 0.45)" id="stat-closed-tickets">
              0
            </div>
            <div style="font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; font-weight: 500;">
              Закрытых
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
          <div style="
              background: rgba(255, 255, 255, 0.03);
              padding: 20px;
              border-radius: 18px;
              border: 1px solid rgba(255, 255, 255, 0.1);
            ">
            <h4 style="margin: 0 0 12px 0; font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px;">
              <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Memo.webp" style="width: 18px; height: 18px; vertical-align: middle;">
              Шаблоны быстрых ответов
            </h4>
            <div id="support-creator-templates-list" style="
                display: flex;
                flex-direction: column;
                gap: 8px;
                max-height: 150px;
                overflow-y: auto;
                margin-bottom: 12px;
              "></div>
            <div style="
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-top: 15px;
              ">
              <input type="text" id="new-template-name" placeholder="Название (кратко)" style="
                  width: 100%;
                  padding: 10px 12px;
                  border-radius: 10px;
                  background: rgba(255, 255, 255, 0.05);
                  border: 1px solid rgba(255, 255, 255, 0.15);
                  color: #ffffff;
                  font-size: 13px;
                  box-sizing: border-box;
                  outline: none;
                ">
              <textarea id="new-template-text" placeholder="Текст шаблона..." style="
                  width: 100%;
                  padding: 10px 12px;
                  border-radius: 10px;
                  background: rgba(255, 255, 255, 0.05);
                  border: 1px solid rgba(255, 255, 255, 0.15);
                  color: #ffffff;
                  font-size: 13px;
                  min-height: 80px;
                  resize: vertical;
                  box-sizing: border-box;
                  outline: none;
                "></textarea>
              <button class="primary-btn" style="padding: 10px 14px; font-size: 13px; font-weight: 700; border-radius: 10px; background: #ffffff; color: #000000; border: none; cursor: pointer;" onclick="SupportSystem.addGlobalTemplate()">
                Добавить шаблон
              </button>
            </div>

            <h4 style="margin: 20px 0 10px 0; font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px;">
              <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Magnifying%20Glass%20Tilted%20Right.webp" style="width: 18px; height: 18px; vertical-align: middle;">
              Аналитика и экспорт
            </h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
              <button class="secondary-btn" style="font-size: 11.5px; padding: 9px 10px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px;" onclick="SupportSystem.exportAllTickets()">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Toolbox.webp" style="width: 14px; height: 14px; vertical-align: -1px;">
                <span>Экспорт активных</span>
              </button>
              <button class="secondary-btn" style="font-size: 11.5px; padding: 9px 10px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px;" onclick="SupportSystem.exportArchiveTickets()">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Objects/Toolbox.webp" style="width: 14px; height: 14px; vertical-align: -1px;">
                <span>Экспорт архива</span>
              </button>
              <button class="secondary-btn" style="font-size: 11.5px; padding: 9px 10px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; grid-column: span 2; display: inline-flex; align-items: center; justify-content: center; gap: 6px;" onclick="SupportSystem.refreshCreatorStats()">
                <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Symbols/Currency%20Exchange.webp" style="width: 14px; height: 14px; vertical-align: -1px;">
                <span>Обновить показатели</span>
              </button>
            </div>
          </div>

          <div style="
              background: rgba(255, 255, 255, 0.03);
              padding: 20px;
              border-radius: 18px;
              border: 1px solid rgba(255, 255, 255, 0.1);
              display: flex;
              flex-direction: column;
              gap: 12px;
            ">
            <h4 style="margin: 0; font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px;">
              <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Technologist.webp" style="width: 18px; height: 18px; vertical-align: middle;">
              Управление системой
            </h4>
            <div style="
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-top: 6px;
              ">
              <button class="secondary-btn" style="font-size: 11px; padding: 9px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;" onclick="SupportSystem.forceSyncAllTickets('all')">
                Удалить закрытые
              </button>
              <button class="secondary-btn" style="font-size: 11px; padding: 9px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;" onclick="SupportSystem.forceSyncAllTickets('old')">
                Удалить > 7 дней
              </button>
              <button class="secondary-btn" style="font-size: 11px; padding: 9px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;" onclick="SupportSystem.closeAllActiveTickets()">
                Закрыть все активные
              </button>
              <button class="danger-btn" style="
                  font-size: 11px;
                  padding: 9px;
                  font-weight: 600;
                  width: auto;
                  border-radius: 10px;
                  background: rgba(255,255,255,0.08);
                  border: 1px solid rgba(255,255,255,0.2);
                  color: #fff;
                " onclick="SupportSystem.deleteAllTickets()">
                Удалить все
              </button>
              <button class="secondary-btn" style="font-size: 11px; padding: 9px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;" onclick="SupportSystem.resetTemplates()">
                Сбросить шаблоны
              </button>
              <button class="secondary-btn" style="font-size: 11px; padding: 9px; font-weight: 600; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff;" onclick="SupportSystem.clearAllBans()">
                Разблокировать всех
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      function togglePasswordVisibility(img, inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        if (input.type === "password") {
          input.type = "text";
          img.src =
            "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Eyes.webp";
        } else {
          input.type = "password";
          img.src =
            "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Face%20With%20Peeking%20Eye.webp";
        }
      }
    </script>
