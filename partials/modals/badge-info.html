<div class="modal" id="modal-badge-info">
      <div class="modal-content glass-panel" style="
          max-width: 400px;
          text-align: center;
          position: relative;
          padding: 40px 20px 30px;
        ">
        <button onclick="
            document
              .getElementById('modal-badge-info')
              .classList.remove('active')
          " style="
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.3s;
            z-index: 10;
            padding: 0;
          " onmouseover="this.style.background = 'rgba(255, 255, 255, 0.2)'" onmouseout="this.style.background = 'rgba(255, 255, 255, 0.1)'">
          ✕
        </button>
        <img loading="lazy" decoding="async" id="badge-modal-icon" src="" style="
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6));
          ">
        <h2 id="badge-modal-title" style="margin: 0 0 10px; font-size: 24px; font-weight: 800"></h2>
        <p id="badge-modal-desc" style="
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
          "></p>
      </div>
    </div>

    <!-- Модальное окно жалобы на профиль -->
