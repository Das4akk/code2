<div class="modal" id="modal-profile-friends" style="z-index: 100004;">
      <div class="modal-content frosted-modal-card" id="profile-friends-modal-card" style="
        position: relative;
        max-width: 470px;
        width: min(470px, calc(100vw - 24px));
        border-radius: 28px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        max-height: 85vh;
        overflow: hidden;
      ">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <div>
            <h3 id="profile-friends-modal-title" style="margin: 0; font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;">
              <span><img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Busts%20In%20Silhouette.webp" style="width:1.2em;height:1.2em;vertical-align:middle;margin-right:6px;" alt="👥">Друзья</span>
            </h3>
            <div id="profile-friends-modal-subtitle" style="font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-top: 3px;">Список друзей</div>
          </div>
          <button type="button" class="btn-close-modal" id="btn-close-profile-friends" onclick="ProfileManager.closeFriendsListModal()" style="
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
          " onmouseover="this.style.background='rgba(255,255,255,0.2)';" onmouseout="this.style.background='rgba(255,255,255,0.08)';">✕</button>
        </div>

        <!-- Search Input -->
        <div style="position: relative; margin-bottom: 14px;">
          <input type="text" id="profile-friends-search" placeholder="Поиск по друзьям..." style="
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
          " onfocus="this.style.background='rgba(255,255,255,0.1)'; this.style.borderColor='rgba(255,255,255,0.28)';" onblur="this.style.background='rgba(255,255,255,0.06)'; this.style.borderColor='rgba(255,255,255,0.12)';">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 13px; top: 50%; transform: translateY(-50%); pointer-events: none;">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <!-- Scrollable Friends List -->
        <div id="profile-friends-modal-list" class="oled-scrollbar" style="
          flex: 1;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 8px;
          background: rgba(0, 0, 0, 0.25);
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 20px;
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          min-height: 220px;
          max-height: 52vh;
        ">
          <!-- Populated dynamically by ProfileManager.openFriendsListModal -->
        </div>
      </div>
    </div>

    <!-- Room User Miniature Modal (1:1 accurate profile replica on frosted monochrome glass) -->
