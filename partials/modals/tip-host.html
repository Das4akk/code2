<div class="modal modal-tip-host" id="modal-tip-host" style="z-index: 100006; background: rgba(0, 0, 0, 0.28) !important; backdrop-filter: blur(4px) !important; -webkit-backdrop-filter: blur(4px) !important;">
  <div class="modal-content" style="width: min(440px, 92vw); padding: 24px; background: rgba(6, 6, 9, 0.45) !important; backdrop-filter: blur(28px) saturate(190%) !important; -webkit-backdrop-filter: blur(28px) saturate(190%) !important; border: 1px solid rgba(255, 255, 255, 0.14) !important; border-radius: 22px !important; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 1px 0 0 rgba(255, 255, 255, 0.2) inset !important; color: #ffffff; position: relative;">
    
    <button type="button" class="btn-close-modal" id="btn-close-tip-host-modal" style="position: absolute; top: 16px; right: 16px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.22)';" onmouseout="this.style.background='rgba(255,255,255,0.08)';">✕</button>

    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;">
      
      <div style="width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 215, 0, 0.25), rgba(255, 255, 255, 0.05)); border: 1px solid rgba(255, 215, 0, 0.4); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);">
        <img loading="lazy" decoding="async" src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" alt="✨" style="width: 34px; height: 34px; object-fit: contain;">
      </div>

      <div>
        <h3 style="margin: 0; font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.01em;">Чаевые автору комнаты</h3>
        <p style="margin: 6px 0 0; font-size: 13px; color: rgba(255, 255, 255, 0.7); line-height: 1.4;">
          Поблагодарите автора за атмосферу и организацию просмотра!
        </p>
      </div>

      <!-- Host recipient card -->
      <div style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; box-sizing: border-box;">
        <div id="tip-host-avatar" style="width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: rgba(255, 255, 255, 0.1); flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          👤
        </div>
        <div style="text-align: left; overflow: hidden; flex: 1;">
          <div id="tip-host-name" style="font-size: 14px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Хост</div>
          <div style="font-size: 11.5px; color: rgba(255, 255, 255, 0.5);">Автор текущей комнаты</div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(255, 215, 0, 0.12); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 10px; font-size: 13px; font-weight: 800; color: #ffd700;">
          <span>50</span>
          <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" style="width: 14px; height: 14px; object-fit: contain;" alt="✨">
        </div>
      </div>

      <!-- Info Box: Balances & Cooldown notice -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: rgba(255, 255, 255, 0.65); background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; padding: 10px 14px; box-sizing: border-box; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>Ваш текущий баланс:</span>
          <span style="font-weight: 700; color: #ffffff; display: inline-flex; align-items: center; gap: 4px;">
            <span id="tip-my-lumens">0</span>
            <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" style="width: 12px; height: 12px;" alt="✨">
          </span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>После отправки:</span>
          <span style="font-weight: 700; color: #ffffff; display: inline-flex; align-items: center; gap: 4px;">
            <span id="tip-after-lumens">0</span>
            <img src="https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp" style="width: 12px; height: 12px;" alt="✨">
          </span>
        </div>
        <div style="font-size: 11px; color: rgba(255, 255, 255, 0.45); border-top: 1px solid rgba(255, 255, 255, 0.06); padding-top: 6px; margin-top: 2px;">
          ⏱️ Чаевые конкретному автору можно отправлять раз в 12 часов.
        </div>
      </div>

      <!-- Error / Notice Msg -->
      <div id="tip-host-status-msg" style="display: none; width: 100%; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; box-sizing: border-box;"></div>

      <!-- Buttons -->
      <div style="width: 100%; display: flex; gap: 10px; margin-top: 4px;">
        <button type="button" id="btn-cancel-tip-host" class="secondary-btn" style="flex: 1; padding: 11px; border-radius: 12px; font-weight: 600; font-size: 13.5px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; cursor: pointer;">
          Отмена
        </button>
        <button type="button" id="btn-confirm-tip-host" class="primary-btn" style="flex: 1.3; padding: 11px; border-radius: 12px; font-weight: 800; font-size: 13.5px; background: #ffffff !important; color: #000000 !important; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <span>Отправить 50 ✨</span>
        </button>
      </div>

    </div>
  </div>
</div>
