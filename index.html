    <script>
      // Suppress Vite HMR websocket noise and unhandled rejections
      window.addEventListener("unhandledrejection", function(event) {
        const reason = event.reason || "";
        const msg = String(reason.message || reason || "");
        if (msg.includes("WebSocket") || msg.includes("ws") || msg.includes("vite")) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener("error", function(event) {
        const msg = String(event.message || "");
        if (msg.includes("WebSocket") || msg.includes("ws") || msg.includes("vite")) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>

    <!-- COWIO Ultra-Optimized Animated & Static Emoji Engine -->
    <script>
      (function() {
        const userPref = localStorage.getItem("staticEmojis");
        const useStatic = userPref === "true";
        window.__COWIO_USE_STATIC_EMOJIS = useStatic;
        if (useStatic) {
          document.documentElement.classList.add("use-static-emojis");
        }

        function isTelegramEmojiUrl(url) {
          if (!url || typeof url !== "string") return false;
          return url.includes("Telegram-Animated-Emojis") ||
                 url.includes("/api/emoji-proxy") ||
                 url.includes("/emoji-proxy");
        }

        function extractEmojiRelPath(url) {
          if (!url || typeof url !== "string") return "";
          try {
            if (url.includes("/api/emoji-proxy") || url.includes("/emoji-proxy")) {
              const u = new URL(url, window.location.origin);
              const p = u.searchParams.get("path") || u.searchParams.get("url") || "";
              return decodeURIComponent(p);
            }
          } catch (e) {}

          const rel = url.replace(/^https?:\/\/[^\/]+(\/gh\/[^\/]+\/[^@]+@[^\/]+\/|\/main\/)?/, "")
                         .replace(/^Telegram-Animated-Emojis\/(main\/)?/, "")
                         .replace(/^\/+/, "");
          try {
            return decodeURIComponent(rel);
          } catch (e) {
            return rel;
          }
        }

        function isRoomReaction(el) {
          if (!el || !(el instanceof Element)) return false;
          if (el.dataset && (el.dataset.isRoomReaction === "1" || el.dataset.roomReaction === "true")) return true;
          if (el.classList && el.classList.contains("room-reaction-anim")) return true;
          if (el.closest && el.closest(".floating-emoji, #reaction-layer, .reaction-layer, .reaction-bar, .react-btn")) return true;
          return false;
        }

        window.getOptimizedEmojiUrl = function(rawUrl, isReaction = false) {
          if (!isTelegramEmojiUrl(rawUrl)) return rawUrl;
          const cleanPath = extractEmojiRelPath(rawUrl);
          if (!cleanPath) return rawUrl;

          const wantStatic = window.__COWIO_USE_STATIC_EMOJIS && !isReaction;
          if (wantStatic) {
            return "/api/emoji-proxy?path=" + encodeURIComponent(cleanPath) + "&static=1";
          }
          // In animated mode: route to high-speed server proxy with local disk cache & ETag
          return "/api/emoji-proxy?path=" + encodeURIComponent(cleanPath);
        };

        // Intercept <img> .src assignment
        const imgProto = HTMLImageElement.prototype;
        const origSrcDesc = Object.getOwnPropertyDescriptor(imgProto, "src");
        if (origSrcDesc && origSrcDesc.set) {
          Object.defineProperty(imgProto, "src", {
            get: function() {
              return origSrcDesc.get.call(this);
            },
            set: function(val) {
              if (typeof val === "string" && isTelegramEmojiUrl(val)) {
                this.dataset.originalEmojiSrc = val;
                const isRx = isRoomReaction(this);
                const optimized = window.getOptimizedEmojiUrl(val, isRx);
                return origSrcDesc.set.call(this, optimized);
              }
              return origSrcDesc.set.call(this, val);
            },
            configurable: true,
            enumerable: true
          });
        }

        // Intercept setAttribute("src", ...)
        const origSetAttr = imgProto.setAttribute;
        imgProto.setAttribute = function(attrName, val) {
          if (String(attrName).toLowerCase() === "src" && typeof val === "string" && isTelegramEmojiUrl(val)) {
            this.dataset.originalEmojiSrc = val;
            const isRx = isRoomReaction(this);
            const optimized = window.getOptimizedEmojiUrl(val, isRx);
            return origSetAttr.call(this, attrName, optimized);
          }
          return origSetAttr.call(this, attrName, val);
        };

        function processImageElement(img) {
          if (!img || img.tagName !== "IMG") return;
          const currentSrc = img.getAttribute("src") || img.src;
          if (!isTelegramEmojiUrl(currentSrc)) return;

          const isRx = isRoomReaction(img);
          if (!img.dataset.originalEmojiSrc) {
            img.dataset.originalEmojiSrc = currentSrc;
          }
          const targetUrl = window.getOptimizedEmojiUrl(img.dataset.originalEmojiSrc, isRx);
          if (img.getAttribute("src") !== targetUrl) {
            origSetAttr.call(img, "src", targetUrl);
          }
          if (!img.getAttribute("loading") && !isRx) {
            origSetAttr.call(img, "loading", "lazy");
          }
          if (!img.getAttribute("decoding")) {
            origSetAttr.call(img, "decoding", "async");
          }
        }

        // Dynamic DOM mutation observer
        const observer = new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const m = mutations[i];
            for (let j = 0; j < m.addedNodes.length; j++) {
              const node = m.addedNodes[j];
              if (node.nodeType === 1) {
                if (node.tagName === "IMG") {
                  processImageElement(node);
                } else if (node.querySelectorAll) {
                  const imgs = node.querySelectorAll("img");
                  for (let k = 0; k < imgs.length; k++) {
                    processImageElement(imgs[k]);
                  }
                }
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        // Process all existing images on DOMContentLoaded
        document.addEventListener("DOMContentLoaded", function() {
          const imgs = document.querySelectorAll("img");
          imgs.forEach(processImageElement);
        });

        // Global switcher for settings
        window.applyStaticEmojisMode = function(isStatic) {
          window.__COWIO_USE_STATIC_EMOJIS = Boolean(isStatic);
          document.documentElement.classList.toggle("use-static-emojis", Boolean(isStatic));

          const imgs = document.querySelectorAll("img");
          imgs.forEach(function(img) {
            const orig = img.dataset.originalEmojiSrc || img.getAttribute("src") || img.src;
            if (!isTelegramEmojiUrl(orig)) return;
            const isRx = isRoomReaction(img);
            if (isRx) return; // Keep room reactions animated!

            const targetUrl = window.getOptimizedEmojiUrl(orig, false);
            if (img.getAttribute("src") !== targetUrl) {
              origSetAttr.call(img, "src", targetUrl);
            }
          });
        };

        // Fallback for image load errors
        window.addEventListener("error", function(e) {
          const el = e.target;
          if (el && el.tagName === "IMG" && isTelegramEmojiUrl(el.src) && !el.dataset.fallbackDone) {
            el.dataset.fallbackDone = "1";
            const isRx = isRoomReaction(el);
            const path = extractEmojiRelPath(el.src);
            const wantStatic = window.__COWIO_USE_STATIC_EMOJIS && !isRx;
            origSetAttr.call(el, "src", "/api/emoji-proxy?path=" + encodeURIComponent(path) + (wantStatic ? "&static=1" : ""));
          }
        }, true);

        // Top 20 popular emojis to preload
        window.TOP_20_EMOJIS = [
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Grinning%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Face%20With%20Tears%20Of%20Joy.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Smiling%20Face%20With%20Heart-Eyes.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Fire.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Clapping%20Hands.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Thumbs%20Up.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Red%20Heart.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Party%20Popper.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Rolling%20On%20The%20Floor%20Laughing.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Face%20Blowing%20A%20Kiss.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Thinking%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Exploding%20Head.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Partying%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Cool.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Eyes.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Star-Struck.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Crying%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Skull.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Trophy.webp"
        ];

        window.preloadTopEmojis = function() {
          if (window.__topEmojisPreloaded) return;
          window.__topEmojisPreloaded = true;
          window.TOP_20_EMOJIS.forEach((src) => {
            const img = new Image();
            img.src = window.getOptimizedEmojiUrl(src);
          });
        };
      })();
    </script>

    <script>
      (function() {
        // Lazy-loading emojis with IntersectionObserver rootMargin 200px
        if ("IntersectionObserver" in window) {
          const emojiObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const target = entry.target;
                if (target.dataset.src) {
                  target.src = target.dataset.src;
                  target.removeAttribute("data-src");
                }
                obs.unobserve(target);
              }
            });
          }, { rootMargin: "200px" });

          window.observeLazyEmoji = function(imgEl) {
            if (imgEl && imgEl.dataset && imgEl.dataset.src) {
              emojiObserver.observe(imgEl);
            }
          };
        }
      })();

      window.toggleSiteParticlesSetting = function (enabled) {
        localStorage.setItem("siteParticles", enabled ? "true" : "false");
        const canvas = document.getElementById("particle-canvas");
        if (canvas)
          canvas.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      window.updateParticleBrightness = function (value) {
        localStorage.setItem("siteParticleBrightness", value);
        const canvas = document.getElementById("particle-canvas");
        if (canvas) canvas.style.setProperty("opacity", value);
      };
      window.toggleSiteNeuroSetting = function (enabled) {
        localStorage.setItem("siteNeuro", enabled ? "true" : "false");
        const bg = document.getElementById("premium-black-bg");
        if (bg)
          bg.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      document.addEventListener("DOMContentLoaded", () => {
        const pVal = localStorage.getItem("siteParticles");
        if (pVal === "false") {
          const cb = document.getElementById("site-settings-particle");
          if (cb) cb.checked = false;
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("display", "none", "important");
        }
        const pBright = localStorage.getItem("siteParticleBrightness");
        if (pBright !== null) {
          const cbBright = document.getElementById(
            "site-settings-particle-brightness",
          );
          if (cbBright) cbBright.value = pBright;
          const cbBrightVal = document.getElementById(
            "particle-brightness-val",
          );
          if (cbBrightVal)
            cbBrightVal.innerText = Math.round(Number(pBright) * 100) + "%";
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("opacity", pBright);
        }
        const nVal = localStorage.getItem("siteNeuro");
        if (nVal === "false") {
          const cb = document.getElementById("site-settings-neuro");
          if (cb) cb.checked = false;
          const bg = document.getElementById("premium-black-bg");
          if (bg) bg.style.setProperty("display", "none", "important");
        }
      });
    </script>

    <script>

          document.documentElement.classList.remove("theme-light-global");

      })();
    </script>
