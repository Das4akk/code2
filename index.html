    <script>
      // Suppress Vite HMR websocket noise and unhandled rejections
      window.addEventListener("unhandledrejection", function(event) {
        const reason = event.reason || "";
        const msg = String(reason.message || reason || "");
        if (msg.includes("WebSocket") || msg.includes("ws") || msg.includes("vite")) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener("error", function(event) {
        const msg = String(event.message || "");
        if (msg.includes("WebSocket") || msg.includes("ws") || msg.includes("vite")) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>

    <!-- High-Performance Animated Stickers & Icons Fallback Engine -->
    <script>
      (function() {
        window.addEventListener("error", function(e) {
          const el = e.target;
          if (el && el.tagName === "IMG" && el.src && el.src.includes("Telegram-Animated-Emojis") && !el.dataset.fallbackDone) {
            el.dataset.fallbackDone = "1";
            const currentSrc = el.src;
            const rel = currentSrc.replace(/^https?:\/\/[^\/]+(\/gh\/[^\/]+\/[^@]+@[^\/]+\/|\/main\/)?/, "")
                                  .replace(/^Telegram-Animated-Emojis\/(main\/)?/, "")
                                  .replace(/^\/+/, "");
            el.src = "/api/emoji-proxy?path=" + encodeURIComponent(decodeURIComponent(rel));
          }
        }, true);
      })();
    </script>

    <script>
      // Respect user choice and hardware capabilities for animated emojis
      (function() {
        const userPref = localStorage.getItem("staticEmojis");
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const saveData = navigator.connection && navigator.connection.saveData === true;
        const lowSpecs = Boolean(navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4);

        const useStatic = userPref === "true" || (userPref === null && (prefersReducedMotion || saveData || lowSpecs));
        window.__COWIO_USE_STATIC_EMOJIS = useStatic;
        if (useStatic) {
          document.documentElement.classList.add("use-static-emojis");
        }

        // Top 20 popular emojis to preload when entering room
        window.TOP_20_EMOJIS = [
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Grinning%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Face%20With%20Tears%20Of%20Joy.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Smiling%20Face%20With%20Heart-Eyes.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Fire.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Clapping%20Hands.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/People/Thumbs%20Up.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Red%20Heart.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Party%20Popper.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Sparkles.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Rolling%20On%20The%20Floor%20Laughing.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Face%20Blowing%20A%20Kiss.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Thinking%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Exploding%20Head.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Partying%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Cool.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Eyes.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Star-Struck.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Crying%20Face.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Smileys/Skull.webp",
          "https://cdn.jsdelivr.net/gh/Tarikul-Islam-Anik/Telegram-Animated-Emojis@main/Activity/Trophy.webp"
        ];

        window.preloadTopEmojis = function() {
          if (window.__topEmojisPreloaded) return;
          window.__topEmojisPreloaded = true;
          window.TOP_20_EMOJIS.forEach((src) => {
            const img = new Image();
            img.src = src;
          });
        };

        // Lazy-loading emojis with IntersectionObserver rootMargin 200px
        if ("IntersectionObserver" in window) {
          const emojiObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const target = entry.target;
                if (target.dataset.src) {
                  target.src = target.dataset.src;
                  target.removeAttribute("data-src");
                }
                obs.unobserve(target);
              }
            });
          }, { rootMargin: "200px" });

          window.observeLazyEmoji = function(imgEl) {
            if (imgEl && imgEl.dataset && imgEl.dataset.src) {
              emojiObserver.observe(imgEl);
            }
          };
        }
      })();

      window.toggleSiteParticlesSetting = function (enabled) {
        localStorage.setItem("siteParticles", enabled ? "true" : "false");
        const canvas = document.getElementById("particle-canvas");
        if (canvas)
          canvas.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      window.updateParticleBrightness = function (value) {
        localStorage.setItem("siteParticleBrightness", value);
        const canvas = document.getElementById("particle-canvas");
        if (canvas) canvas.style.setProperty("opacity", value);
      };
      window.toggleSiteNeuroSetting = function (enabled) {
        localStorage.setItem("siteNeuro", enabled ? "true" : "false");
        const bg = document.getElementById("premium-black-bg");
        if (bg)
          bg.style.setProperty(
            "display",
            enabled ? "block" : "none",
            "important",
          );
      };
      document.addEventListener("DOMContentLoaded", () => {
        const pVal = localStorage.getItem("siteParticles");
        if (pVal === "false") {
          const cb = document.getElementById("site-settings-particle");
          if (cb) cb.checked = false;
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("display", "none", "important");
        }
        const pBright = localStorage.getItem("siteParticleBrightness");
        if (pBright !== null) {
          const cbBright = document.getElementById(
            "site-settings-particle-brightness",
          );
          if (cbBright) cbBright.value = pBright;
          const cbBrightVal = document.getElementById(
            "particle-brightness-val",
          );
          if (cbBrightVal)
            cbBrightVal.innerText = Math.round(Number(pBright) * 100) + "%";
          const canvas = document.getElementById("particle-canvas");
          if (canvas) canvas.style.setProperty("opacity", pBright);
        }
        const nVal = localStorage.getItem("siteNeuro");
        if (nVal === "false") {
          const cb = document.getElementById("site-settings-neuro");
          if (cb) cb.checked = false;
          const bg = document.getElementById("premium-black-bg");
          if (bg) bg.style.setProperty("display", "none", "important");
        }
      });
    </script>

    <script>
      (() => {
        try {
          localStorage.removeItem("cowio:globalTheme");
          document.documentElement.dataset.globalTheme = "dark";
          document.documentElement.classList.remove("theme-light-global");
        } catch (e) {}
      })();
    </script>
