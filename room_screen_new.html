    <section id="room-screen" class="screen">
      <div class="room-shell">
        <div class="room-top-bar glass-panel" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: transparent; border-bottom: none;">
          <div style="display: flex; align-items: center; gap: 16px;">
            <button class="icon-btn" id="btn-leave-room" aria-label="Выйти" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="room-title-wrapper" style="display: flex; flex-direction: column;">
              <h2 id="room-title-text" style="margin: 0; font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px;">Загрузка комнаты...</h2>
              <div id="room-author-info" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-muted); margin-top: 4px;">
                  <div id="room-author-avatar" style="width: 24px; height: 24px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,0.1);"></div>
                  <span id="room-author-name" style="font-weight: 600; color: #eee;">автор комнаты</span>
                  <span id="room-typing-status" style="font-size: 13px; display: inline-block; animation: pulse 1.5s infinite;"></span>
              </div>
            </div>
          </div>
          
          <div style="display: flex; align-items: center; gap: 16px;">
            <button class="secondary-btn" title="На весь экран" id="btn-fullscreen-toggle" style="background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 8px;">⛶</button>
            <button class="secondary-btn" id="btn-room-settings" style="background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; display: none;">настройки</button>
          </div>
        </div>

      <div class="room-layout">
        <div class="player-section" style="padding: 0 24px 24px 24px;">
          <div class="video-container glass-panel" style="position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <video id="native-player" playsinline="" webkit-playsinline="" preload="auto" x5-video-player-type="h5" x5-video-player-fullscreen="true" controls="" style="object-fit: contain; width: 100%; height: 100%"></video>
            <div id="yt-player-container" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; pointer-events: auto; z-index: 5; display: flex; align-items: center; justify-content: center;">
              <div id="yt-player" style="width: 100%; height: 100%; max-width: 100%; max-height: 100%; aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center;"></div>
            </div>
            <div id="room-video-overlay" style="position: absolute; inset: 0; z-index: 8; pointer-events: none;"></div>
            <div id="chat-overlay-container" style="position: absolute; top: 15%; left: 50%; transform: translateX(-50%); width: 80%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; gap: 8px;"></div>
            <div class="reaction-bar" style="right: 20px; bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column;">
              <button class="react-btn" data-emoji="🔥">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/Animals%20and%20Nature/Fire.webp" style="width: 32px; height: 32px; pointer-events: none">
              </button>
              <button class="react-btn" data-emoji="😂">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/Smileys/Face%20With%20Tears%20Of%20Joy.webp" style="width: 32px; height: 32px; pointer-events: none">
              </button>
              <button class="react-btn" data-emoji="😱">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/Smileys/Face%20Screaming%20In%20Fear.webp" style="width: 32px; height: 32px; pointer-events: none">
              </button>
              <button class="react-btn" data-emoji="❤️">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/Symbols/Red%20Heart.webp" style="width: 32px; height: 32px; pointer-events: none">
              </button>
              <button class="react-btn" data-emoji="👏">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Telegram-Animated-Emojis/main/People/Clapping%20Hands.webp" style="width: 32px; height: 32px; pointer-events: none">
              </button>
            </div>
          </div>
        </div>
        <div class="chat-section glass-panel" style="display: flex; flex-direction: column; background: #000; border-left: 1px solid rgba(255,255,255,0.05); border-radius: 0;">
          <div class="panel-love-hearts" id="room-love-hearts"></div>
          
          <div class="chat-header" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button id="chat-tab-prev" style="background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 18px; padding: 0 8px; font-weight: bold; transition: color 0.2s;">&lt;</button>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span id="current-right-tab-title" style="font-weight: 700; font-size: 17px; color: #fff;">Чат</span>
                <span id="users-count" style="font-size: 14px; color: rgba(255,255,255,0.4);">0</span>
              </div>
              <button id="chat-tab-next" style="background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 18px; padding: 0 8px; font-weight: bold; transition: color 0.2s;">&gt;</button>
            </div>
            <button id="btn-chat-close-x" style="background: rgba(255,255,255,0.05); border: none; width: 28px; height: 28px; border-radius: 50%; color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s;">✕</button>
          </div>

          <div class="chat-content-area" id="chat-messages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;"></div>
          <div class="chat-content-area" id="users-list" style="display: none; flex: 1; overflow-y: auto; padding: 16px; flex-direction: column;"></div>
          </div>
          </div>
      </div>
    </div>
    </section>
